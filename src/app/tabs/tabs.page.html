<ion-tabs>
  <ion-tab-bar id="barra-pestanas" slot="bottom">
    <ion-tab-button tab="solicitudes" href="/tabs/solicitudes">
      <ion-icon aria-hidden="true" name="construct-outline"></ion-icon>
      <ion-label>Solicitudes</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="presupuestos" href="/tabs/presupuestos" (click)="reparaService.hayPresupuestoNuevo = false">
      <ion-icon aria-hidden="true" name="receipt-outline"></ion-icon>
      <ion-label>Presupuestos</ion-label>
      <ion-badge *ngIf="reparaService.hayPresupuestoNuevo" color="danger" aria-label="Presupuesto nuevo">1</ion-badge>
    </ion-tab-button>

    <ion-tab-button tab="seguimiento" href="/tabs/seguimiento">
      <ion-icon aria-hidden="true" name="time-outline"></ion-icon>
      <ion-label>Seguimiento</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
