<ion-header class="encabezado-pestana">
  <ion-toolbar>
    <ion-title>Solicitudes</ion-title>
    <p>Revisá tus pedidos de reparación.</p>
  </ion-toolbar>
</ion-header>

<ion-content>

  <div *ngIf="cargando" class="ion-padding" role="status">
    <ion-spinner aria-hidden="true"></ion-spinner>
    <p>Cargando solicitudes…</p>
  </div>

  <div *ngIf="error" class="ion-padding">
    <p role="alert">{{ error }}</p>
    <ion-button (click)="cargarSolicitudes()">Reintentar</ion-button>
  </div>

  <section class="bloque-registros" *ngIf="!cargando && !error">
    <ion-list class="lista-tarjetas" lines="none" *ngIf="solicitudes.length; else sinSolicitudes">
      <ion-item *ngFor="let solicitud of solicitudes">
        <ion-label class="ion-text-wrap">
          <h2>{{ solicitud.equipo }}</h2>
          <p>{{ solicitud.cliente }} · {{ solicitud.fecha }}</p>
          <p>{{ solicitud.descripcion }}</p>
          <ion-badge [attr.data-estado]="solicitud.estado">{{ solicitud.estado }}</ion-badge>
        </ion-label>
        <ion-button *ngIf="rolActivo === 'tecnico' && solicitud.estado !== 'finalizada'"
          slot="end" class="accion-estado" fill="solid" (click)="avanzarEstado(solicitud)">
          <ion-icon slot="start" name="sync-outline" aria-hidden="true"></ion-icon>
          Cambiar estado
        </ion-button>
      </ion-item>
    </ion-list>
    <ng-template #sinSolicitudes>
      <div class="estado-vacio">
        <ion-icon name="document-text-outline" aria-hidden="true"></ion-icon>
        <p>No hay solicitudes registradas.</p>
      </div>
    </ng-template>
  </section>
</ion-content>
