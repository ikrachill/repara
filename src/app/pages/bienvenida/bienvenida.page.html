<ion-content>
  <main class="bienvenida">
    <section class="panel" aria-labelledby="titulo-bienvenida">
      <h1 id="titulo-bienvenida" aria-label="REPARÁ">
        <span class="logo" aria-hidden="true">
          <span class="logo-letra" style="--posicion: 0">R</span>
          <span class="logo-letra" style="--posicion: 1">E</span>
          <span class="logo-letra" style="--posicion: 2">P</span>
          <span class="logo-letra" style="--posicion: 3">A</span>
          <span class="logo-letra" style="--posicion: 4">R</span>
          <span class="logo-letra" style="--posicion: 5">Á</span>
          <span class="logo-letra logo-punto" style="--posicion: 6">.</span>
        </span>
      </h1>
      <ul class="beneficios">
        <li><ion-icon name="checkmark-circle-outline" aria-hidden="true"></ion-icon>Solicitá reparaciones</li>
        <li><ion-icon name="checkmark-circle-outline" aria-hidden="true"></ion-icon>Recibí presupuestos</li>
        <li><ion-icon name="checkmark-circle-outline" aria-hidden="true"></ion-icon>Seguí el estado</li>
      </ul>

      <form (submit)="ingresar($event)" autocomplete="off" aria-describedby="modo-demo">
        <ion-input label="Usuario" labelPlacement="stacked" fill="outline"
          placeholder="Usuario de prueba" autocomplete="off"></ion-input>

        <ion-input label="Contraseña" labelPlacement="stacked" fill="outline"
          type="password" placeholder="Opcional" autocomplete="off"></ion-input>

        <ion-select label="Rol" labelPlacement="stacked" fill="outline"
          [value]="rol" (ionChange)="rol = $event.detail.value">
          <ion-select-option value="cliente">Cliente</ion-select-option>
          <ion-select-option value="tecnico">Técnico</ion-select-option>
        </ion-select>

        <p id="modo-demo">Modo demostración. Podés ingresar sin credenciales.</p>
        <ion-button type="submit" expand="block">Ingresar</ion-button>
      </form>
    </section>
  </main>
</ion-content>
