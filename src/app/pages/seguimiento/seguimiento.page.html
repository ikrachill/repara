<ion-header class="encabezado-pestana">
  <ion-toolbar>
    <ion-title>Seguimiento</ion-title>
    <p>Revisá las novedades de cada reparación.</p>
  </ion-toolbar>
</ion-header>

<ion-content>

  <div *ngIf="cargando" class="ion-padding" role="status">
    <ion-spinner aria-hidden="true"></ion-spinner>
    <p>Cargando seguimientos…</p>
  </div>

  <div *ngIf="error" class="ion-padding">
    <p role="alert">{{ error }}</p>
    <ion-button (click)="cargarSeguimientos()">Reintentar</ion-button>
  </div>

  <section class="bloque-registros" *ngIf="!cargando && !error">
    <ion-list class="lista-tarjetas" lines="none" *ngIf="seguimientos.length; else sinSeguimientos">
      <ion-item *ngFor="let seguimiento of seguimientos" [class.registro-nuevo]="seguimiento.nuevo">
        <ion-label class="ion-text-wrap">
          <h2>{{ seguimiento.equipo }}</h2>
          <p>{{ seguimiento.detalle }}</p>
          <ion-note>{{ seguimiento.fecha }}</ion-note>
        </ion-label>
      </ion-item>
    </ion-list>
    <ng-template #sinSeguimientos>
      <div class="estado-vacio">
        <ion-icon name="time-outline" aria-hidden="true"></ion-icon>
        <p>No hay novedades de seguimiento.</p>
      </div>
    </ng-template>
  </section>
</ion-content>
