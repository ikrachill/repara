<ion-header class="encabezado-pestana">
  <ion-toolbar>
    <ion-title>Presupuestos</ion-title>
    <p>Consultá los costos de tus reparaciones.</p>
  </ion-toolbar>
</ion-header>

<ion-content>

  <div *ngIf="cargando" class="ion-padding" role="status">
    <ion-spinner aria-hidden="true"></ion-spinner>
    <p>Cargando presupuestos…</p>
  </div>

  <div *ngIf="error" class="ion-padding">
    <p role="alert">{{ error }}</p>
    <ion-button (click)="cargarPresupuestos()">Reintentar</ion-button>
  </div>

  <section class="bloque-registros" *ngIf="!cargando && !error">
    <ion-card *ngFor="let presupuesto of presupuestos">
      <ion-card-header>
        <ion-card-title>{{ presupuesto.equipo }}</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <p>Técnico: {{ presupuesto.tecnico }}</p>
        <p>{{ presupuesto.detalle }}</p>
        <p class="monto" aria-label="Monto en guaraníes">Gs. {{ presupuesto.monto | number:'1.0-0' }}</p>
        <ion-badge [attr.data-estado]="presupuesto.estado">{{ presupuesto.estado }}</ion-badge>
      </ion-card-content>
    </ion-card>
    <div class="estado-vacio" *ngIf="!presupuestos.length">
      <ion-icon name="receipt-outline" aria-hidden="true"></ion-icon>
      <p>No hay presupuestos registrados.</p>
    </div>
  </section>
</ion-content>
